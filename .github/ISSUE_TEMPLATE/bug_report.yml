name: Bug report
description: Something in KAT broke or behaves wrong
body:
  - type: input
    id: blender
    attributes:
      label: Blender version
      placeholder: 5.2.2 LTS
    validations:
      required: true
  - type: input
    id: kat
    attributes:
      label: KAT version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Console output or error text
      render: text
